[project]
name = "streamer"
version = "0.1.0"
description = "websocket camera streaming"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "websockets>=15.0.1",
]

[tool.setuptools.packages.find]
exclude = [
    "static*",
    "templates*",
]

[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"
